<div class="card">

  <!-- HEADER -->
  <div class="card-header">
    <div class="title">Orders Management</div>

    <div class="actions">

      <div>
        <button mat-raised-button (click)="fileInput.click()">
          Import Orders
        </button>

        <input
          #fileInput
          type="file"
          hidden
          accept=".csv,.xlsx"
          (change)="onFileSelected($event)"
        >

        <button mat-raised-button (click)="exportOrders()">
          Export Orders
        </button>

      </div>

      <div class="filters">
        <input
          type="date"
          [(ngModel)]="fromDate"
          (change)="dateFilter()"
        />

        <input
          type="date"
          [(ngModel)]="toDate"
          (change)="dateFilter()"
        />

      </div>
      <!-- SEARCH (FIXED)
      <mat-form-field appearance="outline" class="search">
        <mat-label>Search Orders</mat-label>

        <input
          matInput
          placeholder="Order #, table, notes..."
          (keyup.enter)="onSearch($event.target.value)"
        />
      </mat-form-field>
        -->
      <!-- STATUS FILTER -->
      <mat-form-field appearance="outline" class="filter">
        <mat-label>Status</mat-label>

        <mat-select (selectionChange)="onStatusFilter($event.value)">
          <mat-option value="">All</mat-option>
          <mat-option value="New">New</mat-option>
          <mat-option value="Cooking">Cooking</mat-option>
          <mat-option value="ReadyForPickup">Ready</mat-option>
          <mat-option value="Completed">Completed</mat-option>
          <mat-option value="Cancelled">Cancelled</mat-option>
        </mat-select>

      </mat-form-field>

    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">


    <table mat-table [dataSource]="orders" class="mat-elevation-z1">
      <div>
        aa
      </div>
      <!-- ORDER ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="sortable" (click)="onSort('id')">Order #</th>
        <td mat-cell *matCellDef="let r">#{{ r.id }}</td>
      </ng-container>

      <!-- TABLE -->
      <ng-container matColumnDef="tableNumber">
        <th mat-header-cell *matHeaderCellDef>Table</th>
        <td mat-cell *matCellDef="let r">{{ r.tableNumber }}</td>
      </ng-container>

      <!-- ITEMS -->
      <ng-container matColumnDef="items">
        <th mat-header-cell *matHeaderCellDef class="sortable" (click)="onSort('itemscount')">Items</th>
        <td mat-cell *matCellDef="let r">
          <div class="items-preview">
            {{ r.itemsCount }} items
          </div>
        </td>
      </ng-container>

      <!-- TOTAL -->
      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef class="sortable" (click)="onSort('totalprice')">Total</th>
        <td mat-cell *matCellDef="let r">
          <span class="price">
            {{ r.totalPrice | currency:'EUR' }}
          </span>
        </td>
      </ng-container>

      <!-- STATUS -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="sortable" (click)="onSort('status')">Status</th>
        <td mat-cell *matCellDef="let r">
          <span class="status" [ngClass]="r.status.toLowerCase()">
            {{ r.status }}
          </span>
        </td>
      </ng-container>

      <!-- TIME -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef class="sortable" (click)="onSort('createdat')">Time</th>
        <td mat-cell *matCellDef="let r">
          {{ r.createdAtUtc | date:'dd.MM.yyyy HH:mm' }}
        </td>
      </ng-container>

      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="right">Actions</th>
        <td mat-cell *matCellDef="let r" class="right my-actions">

          <button mat-icon-button (click)="view(r.id)" matTooltip="View">
            <mat-icon>visibility</mat-icon>
          </button>

          <button mat-icon-button (click)="changeStatus(r.id)" matTooltip="Update Status">
            <mat-icon>autorenew</mat-icon>
          </button>

        </td>
      </ng-container>

      <!-- ROWS -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </div>

  <!-- PAGINATOR -->
  <mat-paginator
    [length]="total"
    [pageSize]="pageSize"
    [pageIndex]="pageNumber - 1"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="onPage($event)">
  </mat-paginator>

</div>
